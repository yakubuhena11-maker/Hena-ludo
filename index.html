<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Ludo</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- Main Menu -->
    <section id="menu-screen" class="screen">
      <div class="logo">
        <div class="logo-mark">L</div>
        <h1>Ludo</h1>
      </div>

      <p class="subtitle">Classic board game</p>

      <div class="menu-buttons">
        <button id="play-local-btn" class="primary-btn">
          Play Ludo
        </button>

        <button id="vs-computer-btn" class="secondary-btn">
          Vs Computer
        </button>

        <button id="settings-btn" class="secondary-btn">
          Settings
        </button>
      </div>
    </section>

    <!-- Game Screen -->
    <section id="game-screen" class="screen hidden">

      <header class="game-header">
        <button id="back-btn" class="icon-btn" aria-label="Back">
          ←
        </button>

        <div>
          <h2>Ludo</h2>
          <p id="turn-text">Red's turn</p>
        </div>

        <button id="pause-btn" class="icon-btn" aria-label="Pause">
          ⏸
        </button>
      </header>

      <!-- Player information -->
      <div class="players">
        <div class="player red-player" data-player="red">
          <span class="player-dot"></span>
          <span>Red</span>
          <strong id="red-home-count">0/4</strong>
        </div>

        <div class="player green-player" data-player="green">
          <span class="player-dot"></span>
          <span>Green</span>
          <strong id="green-home-count">0/4</strong>
        </div>

        <div class="player yellow-player" data-player="yellow">
          <span class="player-dot"></span>
          <span>Yellow</span>
          <strong id="yellow-home-count">0/4</strong>
        </div>

        <div class="player blue-player" data-player="blue">
          <span class="player-dot"></span>
          <span>Blue</span>
          <strong id="blue-home-count">0/4</strong>
        </div>
      </div>

      <!-- Ludo Board -->
      <div id="ludo-board" class="ludo-board">
        <!-- The board will be generated by game.js -->
      </div>

      <!-- Dice -->
      <div class="dice-area">
        <div id="dice" class="dice">
          <span id="dice-value">–</span>
        </div>

        <button id="roll-btn" class="roll-btn">
          Roll Dice
        </button>
      </div>

      <p id="game-message" class="game-message">
        Roll the dice to begin.
      </p>

    </section>

    <!-- Winner Screen -->
    <section id="winner-screen" class="screen hidden">
      <div class="winner-card">
        <div class="winner-icon">🏆</div>

        <h2 id="winner-title">Red Wins!</h2>

        <p id="winner-message">
          Congratulations!
        </p>

        <button id="play-again-btn" class="primary-btn">
          Play Again
        </button>

        <button id="menu-btn" class="secondary-btn">
          Main Menu
        </button>
      </div>
    </section>

  </main>

  <script src="game.js"></script>
</body>
  </html>
